packages:
  - 'packages/*'
  - 'apps/*'

# pnpm >= 11 reads settings from here, no longer from the `pnpm` field in package.json.
onlyBuiltDependencies:
  - '@napi-rs/canvas'
  - 'better-sqlite3'
  - 'esbuild'
  - 'sharp'
  - 'playwright'

# One resolved version of every shared dependency across the whole workspace.
# Packages reference these as `"typescript": "catalog:"`.
catalog:
  # Frontend. Pinned here so a second Vue package cannot drift from the first.
  '@fontsource-variable/vazirmatn': 5.2.8
  '@playwright/test': 1.62.1
  '@vitejs/plugin-vue': 6.0.8
  '@vue/test-utils': 2.4.11
  '@vueuse/core': 14.4.0
  jsdom: 30.0.1
  pinia: 4.0.3
  vite: 8.2.2
  vue: 3.5.41
  vue-i18n: 11.4.9
  vue-router: 5.2.0
  vue-tsc: 3.3.11

  '@types/node': 24.13.3
  '@vitest/coverage-v8': 4.1.11
  rimraf: 6.1.3
  tsup: 8.5.1
  tsx: 4.23.12
  typescript: 6.0.3
  vitest: 4.1.11
  zod: 4.4.3

allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@intlify/core-base@11.4.9'
  - '@intlify/devtools-types@11.4.9'
  - '@intlify/message-compiler@11.4.9'
  - '@intlify/shared@11.4.9'
  - vue-i18n@11.4.9
