packages:
  - 'packages/*'
  - 'apps/*'

# pnpm >= 11 reads settings from here, no longer from the `pnpm` field in package.json.
onlyBuiltDependencies:
  - '@napi-rs/canvas'
  - 'better-sqlite3'
  - 'esbuild'
  - 'sharp'
  - 'playwright'

# One resolved version of every shared dependency across the whole workspace.
# Packages reference these as `"typescript": "catalog:"`.
catalog:
  '@types/node': 24.13.3
  '@vitest/coverage-v8': 4.1.11
  rimraf: 6.1.3
  tsup: 8.5.1
  tsx: 4.23.12
  typescript: 6.0.3
  vitest: 4.1.11
  zod: 4.4.3

allowBuilds:
  '@google/genai': set this to true or false
  better-sqlite3: true
  esbuild: true
  protobufjs: set this to true or false
  unrs-resolver: true
